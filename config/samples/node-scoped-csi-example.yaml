# Example: CSI node driver (DaemonSet) must be Ready on a node before application pods
# that use CSI volumes are scheduled to that node.
#
# - The DaemonSet and the Deployment opt in with the podsequence.example.com/sequence label.
#   The webhook injects the scheduling gate; no schedulingGates are written by hand.
# - CSI driver pods are pinned to their node by the DaemonSet controller, so group 0 is released
#   immediately on every node.
# - Application pods are not pinned (Deployment). The controller labels every node with
#   podsequence.example.com/seq-<hash>=<satisfied groups> and releases each app pod with a required
#   node affinity "seq-<hash> > 0", so the scheduler only places it on nodes whose CSI pod is Ready.
#   The exact key is shown in `kubectl get podseq csi-driver-sequence -o jsonpath='{.status.nodeEligibilityKey}'`.

apiVersion: scheduling.example.com/v1alpha1
kind: PodSequence
metadata:
  name: csi-driver-sequence
  namespace: kube-system
spec:
  scope: Node
  nodeEligibility:
    method: NodeLabel  # default; only member pods are affected
  podGroups:
    - name: "CSI Driver"
      podSelector:
        matchLabels:
          app: csi-driver
          component: node
    - name: "Application Pods"
      podSelector:
        matchLabels:
          app: myapp
          requires-csi: "true"
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: csi-driver
  namespace: kube-system
  labels:
    podsequence.example.com/sequence: csi-driver-sequence
spec:
  selector:
    matchLabels:
      app: csi-driver
      component: node
  template:
    metadata:
      labels:
        app: csi-driver
        component: node
        podsequence.example.com/sequence: csi-driver-sequence
    spec:
      containers:
      - name: csi-driver
        image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.9.0
        securityContext:
          privileged: true
        volumeMounts:
        - name: plugin-dir
          mountPath: /csi
        - name: registration-dir
          mountPath: /registration
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - "test -S /csi/csi.sock"
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: plugin-dir
        hostPath:
          path: /var/lib/kubelet/plugins/csi-driver
          type: DirectoryOrCreate
      - name: registration-dir
        hostPath:
          path: /var/lib/kubelet/plugins_registry
          type: Directory
---
# Application pods are only scheduled onto nodes where the CSI driver pod is Ready.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
  namespace: kube-system
spec:
  replicas: 3
  selector:
    matchLabels:
      app: myapp
      requires-csi: "true"
  template:
    metadata:
      labels:
        app: myapp
        requires-csi: "true"
        podsequence.example.com/sequence: csi-driver-sequence
    spec:
      containers:
      - name: app
        image: nginx:latest
        volumeMounts:
        - name: data
          mountPath: /data
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: data
        emptyDir: {}  # In a real scenario, this would be a CSI volume
