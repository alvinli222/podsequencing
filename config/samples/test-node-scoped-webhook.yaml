# Node-scoped sequencing with Deployments (unpinned pods).
# Pods opt in with the podsequence.example.com/sequence label; the webhook injects the scheduling gate.
# Groups 1 and 2 are released with a required node affinity on the sequence's node label, so on each
# node test-pod-2 only lands where a Ready test-pod-1 runs, and test-pod-3 only where both are Ready.
# policy: RequireOnNode makes a node without any pod of that group ineligible for later groups.
apiVersion: scheduling.example.com/v1alpha1
kind: PodSequence
metadata:
  name: test-node-scoped-sequence
  namespace: default
spec:
  scope: Node
  podGroups:
  - name: "Test Pod 1"
    policy: RequireOnNode
    podSelector:
      matchLabels:
        app: test-pod-1
  - name: "Test Pod 2"
    policy: RequireOnNode
    podSelector:
      matchLabels:
        app: test-pod-2
  - name: "Test Pod 3"
    podSelector:
      matchLabels:
        app: test-pod-3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-pod-1
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: test-pod-1
  template:
    metadata:
      labels:
        app: test-pod-1
        podsequence.example.com/sequence: test-node-scoped-sequence
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.azure.com/mode
                operator: NotIn
                values:
                - system
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - test-pod-1
              topologyKey: topology.kubernetes.io/zone
      containers:
      - name: test-container
        image: busybox:latest
        command: ["sh", "-c", "echo 'Pod 1 started'; sleep 3600"]
        readinessProbe:
          exec:
            command: ["sh", "-c", "sleep 120 && exit 0"]
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-pod-2
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: test-pod-2
  template:
    metadata:
      labels:
        app: test-pod-2
        podsequence.example.com/sequence: test-node-scoped-sequence
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.azure.com/mode
                operator: NotIn
                values:
                - system
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - test-pod-2
              topologyKey: topology.kubernetes.io/zone
      containers:
      - name: test-container
        image: busybox:latest
        command: ["sh", "-c", "echo 'Pod 2 started'; sleep 3600"]
        readinessProbe:
          exec:
            command: ["sh", "-c", "sleep 120 && exit 0"]
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-pod-3
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: test-pod-3
  template:
