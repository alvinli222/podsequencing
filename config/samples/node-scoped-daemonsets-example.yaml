# Requires Full mode and Linux workers labeled podsequence-demo=true.
# On each node: network + storage agents -> metrics agent -> node service.
# NGINX stands in for each agent; no networking or storage driver is installed.
# Explicit gates make demo startup independent of webhook admission timing.
# Delete this manifest before stopping the controller.
apiVersion: scheduling.example.com/v1alpha1
kind: PodSequence
metadata:
  name: daemonset-startup
  namespace: default
spec:
  scope: Node
  nodeSelector:
    matchLabels:
      podsequence-demo: "true"
      kubernetes.io/os: linux
  podGroups:
    - name: Foundation agents
      policy: RequireOnNode
      podSelector:
        matchLabels:
          podsequence-demo-group: foundation
    - name: Metrics agent
      policy: RequireOnNode
      podSelector:
        matchLabels:
          podsequence-demo-group: metrics
    - name: Node service
      policy: RequireOnNode
      podSelector:
        matchLabels:
          podsequence-demo-group: service
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: demo-network-agent
  namespace: default
  labels:
    podsequence.example.com/sequence: daemonset-startup
spec:
  selector:
    matchLabels:
      app: demo-network-agent
  template:
    metadata:
      labels:
        app: demo-network-agent
        podsequence-demo-group: foundation
        podsequence.example.com/sequence: daemonset-startup
    spec:
      nodeSelector:
        podsequence-demo: "true"
        kubernetes.io/os: linux
      schedulingGates:
        - name: podsequence.example.com/sequence-gate
      containers:
        - name: agent
          image: nginx:stable
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
---
